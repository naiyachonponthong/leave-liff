<script>
/* ============================================================
   USERS — CRUD for system accounts (admin only)
   ============================================================ */
var USR = { list: [], employees: [] };

var ROLE_LABELS = { admin: 'ผู้ดูแลระบบ', hr: 'ฝ่ายบุคคล (HR)', supervisor: 'หัวหน้างาน' };
var ROLE_COLORS = { admin: 'text-bg-danger', hr: 'text-bg-primary', supervisor: 'text-bg-warning' };

$(document).ready(function(){
  $('#btnAddUser').on('click', function(){ openUser(null); });
  $('#btnSaveUser').on('click', saveUser);
  $('#btnReloadAudit').on('click', loadAudit);
  $('#usrEmployee').on('change', updateEmpWarn);
  $('#btnToggleUsrPw').on('click', function(){
    var inp = $('#usrPassword');
    var isText = inp.attr('type') === 'text';
    inp.attr('type', isText ? 'password' : 'text');
    $(this).find('i').attr('class', isText ? 'fi fi-rr-eye' : 'fi fi-rr-eye-crossed');
  });
});

window.PAGE_HOOKS.users = function(){ loadUsers(); loadAudit(); loadEmployeeOptions(); };

// รายชื่อพนักงานสำหรับช่อง "ผูกกับพนักงาน" — โหลดไว้ล่วงหน้าเพื่อให้เปิด modal แล้วเลือกได้ทันที
function loadEmployeeOptions(){
  return api('getEmployeesSimple', APP.token).then(function(r){
    USR.employees = (r.data || []);
  }).catch(function(){});
}

// ซ่อนพนักงานที่ถูกบัญชีอื่นผูกไว้แล้ว (พนักงาน 1 คนผูกได้บัญชีเดียว)
function fillEmployeeSelect(u, isEdit){
  var takenBy = {};
  USR.list.forEach(function(x){ if(x.employee_id) takenBy[x.employee_id] = x.id; });
  var opts = '<option value="">— ไม่ผูก (บัญชีเข้าเว็บอย่างเดียว) —\x3c/option>';
  USR.employees.forEach(function(e){
    if(takenBy[e.id] && (!isEdit || takenBy[e.id] !== u.id)) return;
    opts += '<option value="' + _esc(e.id) + '">' + _esc(e.name)
          + (e.emp_code ? ' (' + _esc(e.emp_code) + ')' : '')
          + (e.line_linked ? ' · ผูก LINE แล้ว' : ' · ยังไม่ผูก LINE')
          + '\x3c/option>';
  });
  $('#usrEmployee').html(opts).val(isEdit ? (u.employee_id || '') : '');
  updateEmpWarn();
}

function updateEmpWarn(){
  $('#usrNoEmpWarn').toggleClass('d-none', !!$('#usrEmployee').val());
}

var AUDIT_LABELS = {
  LOGIN: 'เข้าสู่ระบบ', APPROVE_LEAVE: 'อนุมัติใบลา', REJECT_LEAVE: 'ไม่อนุมัติใบลา',
  CANCEL_LEAVE: 'ยกเลิกใบลา', DELETE_LEAVE: 'ลบใบลา', EDIT_LEAVE: 'แก้ไขใบลา',
  SAVE_USER: 'บันทึกผู้ใช้', DELETE_USER: 'ลบผู้ใช้', SAVE_CONFIG: 'แก้ไขตั้งค่าระบบ'
};
var AUDIT_COLORS = {
  DELETE_LEAVE: 'text-bg-danger', DELETE_USER: 'text-bg-danger', REJECT_LEAVE: 'text-bg-warning',
  APPROVE_LEAVE: 'text-bg-success', LOGIN: 'text-bg-light border text-muted'
};

function loadAudit(){
  tblSkel('#tblAudit', 5);
  api('getAuditLog', APP.token, 200).then(function(r){
    if(r.status !== 'success'){ $('#tblAudit').html('<tr><td colspan="5" class="text-center text-muted py-4">' + _esc(r.message || 'โหลดไม่สำเร็จ') + '\x3c/td>\x3c/tr>'); return; }
    var rows = r.data || [];
    if(!rows.length){ $('#tblAudit').html('<tr><td colspan="5" class="text-center text-muted py-4">ยังไม่มีประวัติ\x3c/td>\x3c/tr>'); return; }
    var html = '';
    rows.forEach(function(a){
      var t = new Date(a.timestamp);
      var when = isNaN(t) ? _esc(a.timestamp) : t.toLocaleString('th-TH', { dateStyle:'short', timeStyle:'short' });
      html += '<tr>'
        + '<td class="text-muted small text-nowrap">' + when + '\x3c/td>'
        + '<td>' + _esc(a.actor_name || '-') + '\x3c/td>'
        + '<td><span class="badge ' + (AUDIT_COLORS[a.action] || 'text-bg-secondary') + '">' + _esc(AUDIT_LABELS[a.action] || a.action) + '\x3c/span>\x3c/td>'
        + '<td>' + _esc(a.target || '-') + '\x3c/td>'
        + '<td class="text-muted small">' + _esc(a.detail || '') + '\x3c/td>'
        + '\x3c/tr>';
    });
    $('#tblAudit').html(html);
  });
}

function _findUser(id){ return USR.list.filter(function(x){ return x.id === id; })[0]; }

function loadUsers(){
  tblSkel('#tblUsers', 7);
  api('getUsers', APP.token).then(function(r){
    if(r.status !== 'success'){ toast('error', r.message); return; }
    USR.list = r.data;
    renderUsers();
  });
}

function renderUsers(){
  var html = '';
  if(!USR.list.length){
    html = '<tr><td colspan="7" class="text-center text-muted py-4">ไม่พบผู้ใช้\x3c/td>\x3c/tr>';
  } else {
    USR.list.forEach(function(u){
      var isSelf = u.username === APP.user.username;
      var roleBadge = '<span class="badge ' + (ROLE_COLORS[u.role] || 'text-bg-secondary') + '">' + _esc(ROLE_LABELS[u.role] || u.role) + '\x3c/span>';
      var activeBadge = u.active !== false
        ? '<span class="badge text-bg-success">ใช้งาน\x3c/span>'
        : '<span class="badge text-bg-secondary">ปิดใช้\x3c/span>';
      var deleTag = '';
      if(u.delegate_user_id){
        var dele = _findUser(u.delegate_user_id);
        var period = (u.delegate_from || u.delegate_to)
          ? ' ' + (u.delegate_from ? fmtDateBE(u.delegate_from) : '') + '–' + (u.delegate_to ? fmtDateBE(u.delegate_to) : '')
          : '';
        deleTag = '<br><span class="badge text-bg-info mt-1" title="มอบหมายให้อนุมัติแทน">'
          + '<i class="fi fi-rr-user-add">\x3c/i> แทนโดย ' + _esc(dele ? (dele.name || dele.username) : '?') + _esc(period) + '\x3c/span>';
      }
      // บัญชีที่ไม่ผูกพนักงานจะผูก LINE ไม่ได้ ต้องเตือนให้เห็นตั้งแต่ในตาราง
      var empTag;
      if(!u.employee_id){
        empTag = '<span class="badge text-bg-warning" title="ยังไม่ผูกพนักงาน — ผูก LINE ไม่ได้ จึงรับแจ้งเตือน/อนุมัติผ่าน LINE ไม่ได้">'
          + '<i class="fi fi-rr-triangle-warning">\x3c/i> ยังไม่ผูกพนักงาน\x3c/span>';
      } else if(u.employee_line_linked){
        empTag = '<span class="badge text-bg-success"><i class="fi fi-rr-check">\x3c/i> ' + _esc(u.employee_name || '-') + '\x3c/span>';
      } else {
        empTag = '<span class="badge badge-soft" title="ผูกพนักงานแล้ว แต่พนักงานคนนี้ยังไม่ได้ผูก LINE">'
          + _esc(u.employee_name || '-') + ' · ยังไม่ผูก LINE\x3c/span>';
      }
      html += '<tr>'
        + '<td><b>' + _esc(u.name || '-') + '\x3c/b>' + (isSelf ? ' <span class="badge text-bg-light border text-muted ms-1">คุณ\x3c/span>' : '') + deleTag + '\x3c/td>'
        + '<td><code>' + _esc(u.username) + '\x3c/code>\x3c/td>'
        + '<td>' + roleBadge + '\x3c/td>'
        + '<td>' + empTag + '\x3c/td>'
        + '<td class="text-muted">' + _esc(u.email || '-') + '\x3c/td>'
        + '<td class="text-center">' + activeBadge + '\x3c/td>'
        + '<td class="text-end">'
        +   '<button class="btn btn-ghost btn-sm me-1 u-edit" data-id="' + _esc(u.id) + '"><i class="fi fi-rr-edit">\x3c/i>\x3c/button>'
        +   (isSelf ? '' : '<button class="btn btn-ghost btn-sm text-danger u-del" data-id="' + _esc(u.id) + '" data-name="' + _esc(u.username) + '"><i class="fi fi-rr-trash">\x3c/i>\x3c/button>')
        + '\x3c/td>'
        + '\x3c/tr>';
    });
  }
  $('#tblUsers').html(html);

  $('.u-edit').off('click').on('click', function(){ openUser(_findUser($(this).data('id'))); });
  $('.u-del').off('click').on('click', function(){ confirmDeleteUser($(this).data('id'), $(this).data('name')); });
}

function openUser(u){
  var isEdit = !!u;
  $('#userModalTitle').text(isEdit ? 'แก้ไขผู้ใช้' : 'เพิ่มผู้ใช้');

  // ตัวเลือกผู้อนุมัติแทน — ทุกบัญชีที่ใช้งานอยู่ ยกเว้นตัวเอง (มอบหมายให้ตัวเองไม่มีความหมาย)
  var opts = '<option value="">— ไม่มอบหมาย —\x3c/option>';
  USR.list.forEach(function(x){
    if(x.active === false) return;
    if(isEdit && x.id === u.id) return;
    opts += '<option value="' + _esc(x.id) + '">' + _esc(x.name || x.username)
          + ' (' + _esc(ROLE_LABELS[x.role] || x.role) + ')\x3c/option>';
  });
  $('#usrDelegate').html(opts).val(isEdit ? (u.delegate_user_id || '') : '');
  $('#usrDelegateFrom').val(isEdit ? (u.delegate_from || '') : '');
  $('#usrDelegateTo').val(isEdit ? (u.delegate_to || '') : '');

  fillEmployeeSelect(u, isEdit);
  // เผื่อเปิด modal ก่อนรายชื่อพนักงานโหลดเสร็จ — โหลดแล้วเติมตัวเลือกให้อีกรอบ
  if(!USR.employees.length){ loadEmployeeOptions().then(function(){ fillEmployeeSelect(u, isEdit); }); }

  $('#usrId').val(isEdit ? u.id : '');
  $('#usrName').val(isEdit ? (u.name || '') : '');
  $('#usrUsername').val(isEdit ? (u.username || '') : '');
  $('#usrRole').val(isEdit ? (u.role || 'hr') : 'hr');
  $('#usrEmail').val(isEdit ? (u.email || '') : '');
  $('#usrPassword').val('').attr('type', 'password');
  $('#btnToggleUsrPw i').attr('class', 'fi fi-rr-eye');
  $('#usrActive').prop('checked', isEdit ? u.active !== false : true);
  $('#usrPwLabel').text(isEdit ? 'รหัสผ่านใหม่' : 'รหัสผ่าน');
  $('#usrPwHint').toggle(isEdit);
  new bootstrap.Modal('#modalUser').show();
}

function saveUser(){
  var id = $('#usrId').val().trim();
  var name = $('#usrName').val().trim();
  var username = $('#usrUsername').val().trim().toLowerCase();
  var role = $('#usrRole').val();
  var email = $('#usrEmail').val().trim();
  var password = $('#usrPassword').val();
  var active = $('#usrActive').is(':checked');

  if(!name){ toast('error','กรุณาระบุชื่อ'); return; }
  if(!username){ toast('error','กรุณาระบุชื่อผู้ใช้'); return; }
  if(!id && !password){ toast('error','กรุณาระบุรหัสผ่าน'); return; }

  var delegateFrom = $('#usrDelegateFrom').val();
  var delegateTo = $('#usrDelegateTo').val();
  if(delegateFrom && delegateTo && delegateTo < delegateFrom){ toast('error','วันสิ้นสุดการมอบหมายต้องไม่ก่อนวันเริ่ม'); return; }

  var payload = {
    id: id, name: name, username: username, role: role, email: email, active: active,
    employee_id: $('#usrEmployee').val() || '',
    delegate_user_id: $('#usrDelegate').val() || '',
    delegate_from: delegateFrom, delegate_to: delegateTo
  };
  if(password) payload.password = password;

  setBtnLoading('#btnSaveUser', true);
  api('saveUser', APP.token, payload).then(function(r){
    setBtnLoading('#btnSaveUser', false);
    toast(r.status === 'success' ? 'success' : 'error', r.message);
    if(r.status === 'success'){
      bootstrap.Modal.getInstance(document.getElementById('modalUser')).hide();
      loadUsers();
    }
  }).catch(function(){ setBtnLoading('#btnSaveUser', false); });
}

function confirmDeleteUser(id, username){
  Swal.fire({
    title: 'ลบผู้ใช้?',
    html: 'ต้องการลบบัญชี <b>' + _esc(username) + '\x3c/b> ใช่หรือไม่?',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonText: 'ลบ',
    cancelButtonText: 'ยกเลิก',
    confirmButtonColor: '#dc3545'
  }).then(function(res){
    if(!res.isConfirmed) return;
    api('deleteUser', APP.token, id).then(function(r){
      toast(r.status === 'success' ? 'success' : 'error', r.message);
      if(r.status === 'success') loadUsers();
    });
  });
}
</script>
